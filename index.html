<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Web App Demo</title>
    <!-- Правильный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Используем нативные цвета Telegram для адаптации под тему пользователя */
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            margin-top: 20px;
            padding: 12px 24px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Привет, <span id="username">Незнакомец</span>!</h2>
        <p>ID: <span id="userid">-</span></p>
        <p>Это тестовое Telegram Web App на GitHub Pages.</p>
    </div>

    <!-- Кнопка внутри страницы (альтернатива MainButton) -->
    <button onclick="sendDataToBot()">Отправить данные в бота</button>

    <script>
        // Инициализация Web App
        const tg = window.Telegram.WebApp;

        // Сообщаем Telegram, что приложение готово
        tg.ready();

        // Разворачиваем приложение на весь экран
        tg.expand();

        // 1. ПОЛУЧЕНИЕ ДАННЫХ ИЗ TELEGRAM
        // initDataUnsafe содержит данные о пользователе (безопасно только для отображения!)
        const user = tg.initDataUnsafe?.user;

        if (user) {
            document.getElementById('username').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('userid').innerText = user.id;
        }

        // Настройка главной кнопки (MainButton) внизу экрана
        tg.MainButton.setText("ОТПРАВИТЬ ДАННЫЕ И ЗАКРЫТЬ");
        tg.MainButton.show();

        // 2. ОТПРАВКА ДАННЫХ В БОТА
        // Функция sendData закрывает Web App и отправляет строку в чат с ботом от имени пользователя
        function sendDataToBot() {
            const dataToSend = JSON.stringify({
                action: "test_action",
                message: "Привет из Web App!",
                timestamp: new Date().toISOString()
            });
            
            // Отправка данных (строка)
            tg.sendData(dataToSend);
        }

        // Привязываем отправку к главной кнопке Telegram
        tg.MainButton.onClick(sendDataToBot);

    </script>
</body>
</html>
